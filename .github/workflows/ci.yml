name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - run: test -z "$(gofmt -l *.go)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go test -run='^$' -fuzz=FuzzExportName -fuzztime=10s
      - name: Install package builder
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.0
      - run: ./scripts/release.sh v0.0.0-test
